{% extends 'base.html' %}

{% block content %}
<div class="container mt-5">
  <div class="row">
    <div class="col-md-6 offset-md-3">
      <div class="card">
        <div class="card-header bg-primary text-white">
          <h5 class="mb-0">User Settings</h5>
        </div>
        <div class="card-body">
          <form method="POST">
            <div class="mb-3">
              <label for="username" class="form-label">Username</label>
              <input type="text" class="form-control" id="username" value="{{ user.username }}" disabled>
              <small class="text-muted">Your username (cannot be changed)</small>
            </div>

            <div class="mb-3">
              <label for="timezone" class="form-label">Timezone</label>
              <select class="form-select" id="timezone" name="timezone" required>
                <option value="">-- Select your timezone --</option>
                {% for tz in timezones %}
                  <option value="{{ tz }}" {% if tz == user.timezone %}selected{% endif %}>
                    {{ tz }}
                  </option>
                {% endfor %}
              </select>
              <small class="text-muted">All your todo timestamps will be displayed in this timezone</small>
            </div>

            <div class="mb-3">
              <label class="form-label">Current Timezone Setting</label>
              <div class="alert alert-info mb-0">
                <strong>{{ user.timezone }}</strong>
              </div>
            </div>

            <div class="d-grid gap-2">
              <button type="submit" class="btn btn-primary">Save Timezone</button>
              <a href="{{ url_for('index') }}" class="btn btn-secondary">Back to Todos</a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
