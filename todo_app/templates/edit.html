{% extends 'base.html' %}

{% block content %}
  <h2>Edit Todo</h2>
  <form method="post">
    <div class="mb-3">
      <label class="form-label">Title</label>
      <input name="title" class="form-control" value="{{ todo.title }}" required />
    </div>
    <div class="mb-3">
      <label class="form-label">Description</label>
      <textarea name="description" class="form-control" rows="3">{{ todo.description or '' }}</textarea>
    </div>
    <div class="form-check mb-3">
      <input class="form-check-input" type="checkbox" name="done" id="done" {% if todo.done %}checked{% endif %}>
      <label class="form-check-label" for="done">Done</label>
    </div>
    <button class="btn btn-primary">Save</button>
    <a class="btn btn-link" href="{{ url_for('index') }}">Cancel</a>
  </form>

  <hr />
  <div class="small text-muted">
    <p>Created: <strong>{{ todo.created_at_user_tz().strftime('%Y-%m-%d %H:%M:%S %Z') }}</strong></p>
    <p>Last Updated: <strong>{{ todo.updated_at_user_tz().strftime('%Y-%m-%d %H:%M:%S %Z') }}</strong></p>
    <p>Your Timezone: <strong>{{ user.timezone }}</strong></p>
  </div>
{% endblock %}
