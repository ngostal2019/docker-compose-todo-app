services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: strongrootpass
      MYSQL_DATABASE: todo_db
      MYSQL_USER: todo_user
      MYSQL_PASSWORD: yourpass
      TZ: "America/Chicago"
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "3306:3306"

  web:
    build:
      context: .
      dockerfile: todo_app/Dockerfile
    depends_on:
      - db
    environment:
      DATABASE_URL: "mysql+pymysql://todo_user:yourpass@db:3306/todo_db"
      SECRET_KEY: "dev-secret"
      TZ: "America/Chicago"
    ports:
      - "5000:5000"
    restart: on-failure
    volumes:
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro

volumes:
  db_data:
